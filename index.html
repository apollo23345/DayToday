<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day of the Week Activity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 1200px;
            text-align: center;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        #output {
        font-family: 'Courier New', Courier, monospace;
        white-space: pre;
        background: #090d16;
        color: #4ade80;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #1e293b;
        overflow-x: auto;
        text-align: center;
        /* SCALES NEATLY INSIDE THE CARD */
        width: 100%;
        font-size: 0.75rem;
        line-height: 1.2;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .reload-btn {
    margin-top: 20px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
}

.reload-btn:hover {
    background: #7dd3fc;
    transform: translateY(-2px);
    box-shadow: 0 6px 10px -1px rgba(56, 189, 248, 0.3);
}

.reload-btn:active {
    transform: translateY(0);
}
.day-text {
    font-size: 1.8rem; /* Adjust this value to make the text bigger or smaller */
    font-weight: bold;
    color: #38bdf8;
    margin: 10px 0;
}
    </style>
</head>
<body>

<div class="card">
    <h2>Day of the Week Finder</h2>
    <pre id="output"></pre>
    
    <button onclick="location.reload();" class="reload-btn">Try Again</button>
</div>
<!-- Background Audio Element -->
<audio id="bgMusic" loop>
    <!-- Replace 'music.mp3' with your actual audio file name/path -->
    <source src="music/When-I-Was-A-Boy(chosic.com).mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
    <script>
// Initialize audio
var bgMusic = document.getElementById("bgMusic");

function playAudio() {
    if (bgMusic && bgMusic.paused) {
        bgMusic.volume = 0.3;
        bgMusic.play().catch(function(e) {
            console.log("Audio play deferred until next interaction.");
        });
    }
}

// Start audio as soon as the user clicks anywhere on the page
document.addEventListener('click', playAudio, { once: true });  
function openGroupPictureWindow() {
    var myWindow = window.open("", "_blank", "width=850, height=700");

    // Array holding image filenames and their corresponding display names
    var members = [
        { file: "Apollo_w_tie.png", name: "Padilla,Apollo Justine" },
        { file: "DelaCruz.png",     name: "Dela Cruz, Christian Joshua" },
        { file: "Garcia.JPG",       name: "Garcia, Paul Ryan" },
        { file: "Marquez.png",      name: "Marquez, Hannah Ysabella" },
        { file: "Pili.png",         name: "Pili, Russel Jhon" }
    ];

    var popUpHTML = `
        <html>
        <head>
            <title>Group Members</title>
            <style>
                body {
                    font-family: 'Segoe UI', sans-serif;
                    background-color: #0f172a;
                    color: #f8fafc;
                    margin: 0;
                    padding: 20px;
                    text-align: center;
                }
                h3 {
                    color: #38bdf8;
                    margin-bottom: 20px;
                    font-size: 1.5rem;
                }
                .grid {
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: center;
                    gap: 15px;
                }
                .card {
                    background: #1e293b;
                    padding: 12px;
                    border-radius: 12px;
                    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                    transition: transform 0.2s;
                    width: 200px;
                }
                .card:hover {
                    transform: translateY(-4px);
                }
                img {
                    width: 100%;
                    height: 220px;
                    object-fit: cover;
                    border-radius: 8px;
                    display: block;
                }
                .member-name {
                    margin-top: 10px;
                    font-size: 1rem;
                    font-weight: 600;
                    color: #38bdf8;
                }
            </style>
        </head>
        <body>
            <h3>Group Members</h3>
            <div class="grid">
    `;

    // Loop through all 5 members and generate image + name card
    for (var i = 0; i < members.length; i++) {
        var imagePath = window.location.origin + "/images/" + members[i].file;
        popUpHTML += `
            <div class="card">
                <img src="${imagePath}" alt="${members[i].name}">
                <div class="member-name">${members[i].name}</div>
            </div>
        `;
    }

    popUpHTML += `</div></body></html>`;
    myWindow.document.write(popUpHTML);
}

        // Get user input
        var input = prompt("Enter a number from 1 to 7:");
        var dayNumber = parseInt(input);
        var outputElement = document.getElementById("output");

        // Switch statement to handle day numbers
        switch (dayNumber) {
    case 1:
        outputElement.innerHTML = "<div class='day-text'>Today is Monday</div>";
        break;
    case 2:
        outputElement.innerHTML = "<div class='day-text'>Today is Tuesday</div>";
        break;
    case 3:
        outputElement.innerHTML = "<div class='day-text'>Today is Wednesday</div>";
        break;
    case 4:
        outputElement.innerHTML = "<div class='day-text'>Today is Thursday</div>";
        break;
    case 5:
        outputElement.innerHTML = "<div class='day-text'>Today is Friday</div>";
        break;
    case 6:
        outputElement.innerHTML = "<div class='day-text'>Today is Saturday</div>";
        break;
    case 7:
        outputElement.innerHTML = "<div class='day-text'>Today is Sunday</div>";
        break;
    default:
                var asteriskArt = 
                    "*   * ***** *     *     ***   ,   *     ***  *   * ***** ,    ***   ***   ***  ***   ****  *   * *****\n" +
                    "*   * *     *     *    *   *  ,   *    *   * *   * *     ,   *   * *   * *   * *   * *   * *   * *    \n" +
                    "*   * *     *     *    *   *      *    *   * *   * *         *     *   * *   * *   * *   * *   * *    \n" +
                    "***** ****  *     *    *   *      *    *   * *   * ****      * *** *   * *   * *   * ****   ***  **** \n" +
                    "*   * *     *     *    *   *      *    *   * *   * *         *   * *   * *   * *   * *   *   *   *    \n" +
                    "*   * *     *     *    *   *      *    *   *  * *  *         *   * *   * *   * *   * *   *   *   *    \n" +
                    "*   * ***** ***** ***** ***       ****  ***    *   *****      ***   ***   ***   ***  ****    *   *****\n" +
                    "                                                                                                   ";

                outputElement.textContent = asteriskArt;
                openGroupPictureWindow();
                break;
        }
    </script>

</body>
</html>
