<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day of the Week Activity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 800px;
            text-align: center;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        #output {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            background: #090d16;
            color: #4ade80;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #1e293b;
            overflow-x: auto;
            text-align: left;
            display: inline-block;
            font-size: 0.85rem;
            line-height: 1.2;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Day of the Week Finder</h2>
        <pre id="output"></pre>
    </div>

    <script>
        function openGroupPictureWindow() {
            var myWindow = window.open("", "_blank", "width=800, height=650");

            var imageNames = [
                "Apollo_w_tie.png",
                "DelaCruz.png",
                "Garcia.JPG",
                "Marquez.png",
                "Pili.png"
            ];

            var popUpHTML = `
                <html>
                <head>
                    <title>Group Members</title>
                    <style>
                        body {
                            font-family: 'Segoe UI', sans-serif;
                            background-color: #0f172a;
                            color: #f8fafc;
                            margin: 0;
                            padding: 20px;
                            text-align: center;
                        }
                        h3 {
                            color: #38bdf8;
                            margin-bottom: 20px;
                            font-size: 1.5rem;
                        }
                        .grid {
                            display: flex;
                            flex-wrap: wrap;
                            justify-content: center;
                            gap: 15px;
                        }
                        .card {
                            background: #1e293b;
                            padding: 10px;
                            border-radius: 12px;
                            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                            transition: transform 0.2s;
                        }
                        .card:hover {
                            transform: translateY(-4px);
                        }
                        img {
                            width: 200px;
                            height: 220px;
                            object-fit: cover;
                            border-radius: 8px;
                            display: block;
                        }
                    </style>
                </head>
                <body>
                    <h3>Group Members</h3>
                    <div class="grid">
            `;

            for (var i = 0; i < imageNames.length; i++) {
                var imagePath = window.location.origin + "/images/" + imageNames[i];
                popUpHTML += `
                    <div class="card">
                        <img src="${imagePath}" alt="Member ${i + 1}">
                    </div>
                `;
            }

            popUpHTML += `</div></body></html>`;
            myWindow.document.write(popUpHTML);
        }

        // Get user input
        var input = prompt("Enter a number from 1 to 7:");
        var dayNumber = parseInt(input);
        var outputElement = document.getElementById("output");

        // Switch statement to handle day numbers
        switch (dayNumber) {
            case 1:
                outputElement.textContent = "Today is Monday";
                break;
            case 2:
                outputElement.textContent = "Today is Tuesday";
                break;
            case 3:
                outputElement.textContent = "Today is Wednesday";
                break;
            case 4:
                outputElement.textContent = "Today is Thursday";
                break;
            case 5:
                outputElement.textContent = "Today is Friday";
                break;
            case 6:
                outputElement.textContent = "Today is Saturday";
                break;
            case 7:
                outputElement.textContent = "Today is Sunday";
                break;
            default:
                var asteriskArt = 
                    "*   * ***** *     *     ***   ,   *     ***  *   * ***** ,   ****  ***   ***  ***   ****  *   * *****\n" +
                    "*   * *     *     *    *   *  ,   *    *   * *   * *     ,   *   **   * *   * *   * *   * *   * *\n" +
                    "***** ****  *     *    *   *      *    *   * *   * ****      *   **   * *   * *   * ****   ***  ****\n" +
                    "***** ****  *     *    *   *      *    *   * *   * ****      **** *   * *   * *   * ****    *   ****\n" +
                    "*   * *     *     *    *   *      *    *   * *   * *         *   **   * *   * *   * *   *   *   *\n" +
                    "*   * *     *     *    *   *      *    *   *  * *  *         *   **   * *   * *   * *   *   *   *\n" +
                    "*   * ***** ***** ***** ***       ****  ***    *   *****     ****  ***   ***   ***  ****    *   *****\n" +
                    "                                                                                                   \n" +
                    "                                                                                                   \n" +
                    "                                                                                                   ";

                outputElement.textContent = asteriskArt;
                openGroupPictureWindow();
                break;
        }
    </script>

</body>
</html>
