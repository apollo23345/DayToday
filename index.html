<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day of the Week Activity</title>
</head>
<body>

    <h2>Day of the Week Finder</h2>
    <p id="output" style="font-family: monospace; white-space: pre;"></p>

    <script>
function openGroupPictureWindow() {
    var myWindow = window.open("", "_blank", "width=700, height=600");

    // List all 5 image file names here (make sure these match your files in the /images/ folder)
    var imageNames = [
        "Apollo_w_tie.png",
        "DelaCruz.png",
        "Garcia.JPG",
        "Marquez.png",
        "Pili.png"
    ];

    myWindow.document.write("<html><head><title>Group Members</title></head><body style='text-align:center; font-family:sans-serif;'>");
    myWindow.document.write("<h3>Group Members</h3>");
    myWindow.document.write("<div style='display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;'>");

    // Loop through all 5 images
    for (var i = 0; i < imageNames.length; i++) {
        var imagePath = window.location.origin + "/images/" + imageNames[i];
        myWindow.document.write("<img src='" + imagePath + "' alt='Member " + (i + 1) + "' style='width:180px; height:auto; border-radius:8px; object-fit:cover;'>");
    }

    myWindow.document.write("</div></body></html>");
}

        // Get user input
        var input = prompt("Enter a number from 1 to 7:");
        var dayNumber = parseInt(input);
        var outputElement = document.getElementById("output");

        // Switch statement to handle day numbers
        switch (dayNumber) {
            case 1:
                outputElement.textContent = "Today is Monday";
                break;
            case 2:
                outputElement.textContent = "Today is Tuesday";
                break;
            case 3:
                outputElement.textContent = "Today is Wednesday";
                break;
            case 4:
                outputElement.textContent = "Today is Thursday";
                break;
            case 5:
                outputElement.textContent = "Today is Friday";
                break;
            case 6:
                outputElement.textContent = "Today is Saturday";
                break;
            case 7:
                outputElement.textContent = "Today is Sunday";
                break;
            default:
    // Exactly 10 lines of ASCII text
    var asteriskArt = 
        "*   * ***** *     *     ***   ,   *     ***  *   * ***** ,   ****  ***   ***  ***   ****  *   * *****\n" +
        "*   * *     *     *    *   *  ,   *    *   * *   * *     ,   *   **   * *   * *   * *   * *   * *\n" +
        "***** ****  *     *    *   *      *    *   * *   * ****      *   **   * *   * *   * ****   ***  ****\n" +
        "***** ****  *     *    *   *      *    *   * *   * ****      **** *   * *   * *   * ****    *   ****\n" +
        "*   * *     *     *    *   *      *    *   * *   * *         *   **   * *   * *   * *   *   *   *\n" +
        "*   * *     *     *    *   *      *    *   *  * *  *         *   **   * *   * *   * *   *   *   *\n" +
        "*   * ***** ***** ***** ***       ****  ***    *   *****     ****  ***   ***   ***  ****    *   *****\n" +
        "                                                                                                   \n" +
        "                                                                                                   \n" +
        "                                                                                                   ";

    outputElement.textContent = asteriskArt;
    openGroupPictureWindow();
    break;
        }
    </script>

</body>
</html>
